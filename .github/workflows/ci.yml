name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # The engine decodes untrusted image files through six pinned native libraries, so
  # waiting for someone to push before revalidating is too slow: a newly disclosed
  # vulnerability or an upstream package regression should surface on its own.
  schedule:
    - cron: "17 5 * * 1"  # Mondays, 05:17 UTC
  workflow_dispatch:

# Cancel superseded runs on the same ref. Keyed by event as well, so the weekly
# scheduled run cannot cancel an in-flight run for someone's push to the same branch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The primary gate: the headless engine core + unit tests. No Qt, no GPU, no
  # display required, so it is fast and reliable. Warnings are errors here.
  # ---------------------------------------------------------------------------
  core-linux:
    name: Engine core (Linux, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build liblcms2-dev libpng-dev libturbojpeg0-dev zlib1g-dev libtiff-dev libwebp-dev pkg-config clang-format
      - name: clang-format check (enforced)
        run: |
          # Enforce formatting on the merge gate. Uses the committed .clang-format.
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) | sort | xargs clang-format --dry-run --Werror --style=file
      - name: Configure
        run: cmake --preset linux-core-dev
      - name: Build
        run: cmake --build build/linux-core-dev
      - name: Test
        run: ctest --preset linux-core-dev

      # Address + UB sanitizers: build the headless engine + tests and RUN them.
      - name: ASan/UBSan
        run: |
          cmake -B build/asan -S . -G Ninja -DPHOTOEDIT_BUILD_APP=OFF -DPHOTOEDIT_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPHOTOEDIT_WERROR=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build/asan
          ASAN_OPTIONS=abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/asan --output-on-failure

  # ---------------------------------------------------------------------------
  # The primary platform target: the full Qt6 application on Windows/MSVC.
  # Qt comes from aqtinstall; other native libs are added as the engine starts
  # using them (see vcpkg.json).
  # ---------------------------------------------------------------------------
  app-windows:
    name: Full app (Windows, MSVC + Qt6)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Install native libs (vcpkg)
        # Provision the optional libraries so color management + the PNG/JPEG codecs
        # are built and tested on Windows too (matching the Linux lane). Dynamic
        # x64-windows triplet: transitive deps (libpng->zlib) resolve at load time;
        # the DLL dir is added to PATH for the test step below.
        # --classic: the repo's vcpkg.json would otherwise force manifest mode, where
        # `vcpkg install <pkg>` is rejected. Classic mode installs the named ports only
        # (Qt still comes from aqtinstall, not vcpkg).
        run: vcpkg install lcms libpng libjpeg-turbo zlib tiff libwebp --triplet x64-windows --classic
      - name: Configure
        run: >
          cmake -B build/win -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPHOTOEDIT_BUILD_APP=ON
          -DPHOTOEDIT_BUILD_TESTS=ON
          "-DCMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
      - name: Build
        run: cmake --build build/win
      - name: Test
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build/win --output-on-failure

  # ---------------------------------------------------------------------------
  # Dependency-free lane: build the engine + tests with NONE of the optional
  # libraries installed, so every codec / color / zlib path compiles out via its
  # PHOTOEDIT_HAVE_* guard. This is what a fresh machine (or a minimal container)
  # sees; it stops the headless core from silently growing a hard dependency.
  # Warnings are errors here too.
  # ---------------------------------------------------------------------------
  core-linux-nodeps:
    name: Engine core (Linux, no optional deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools only (no image/color/zlib libs)
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (force optional deps off, then verify none slipped in)
        run: |
          set -eo pipefail
          # PHOTOEDIT_NO_OPTIONAL_DEPS makes this deterministic: the runner ships ubiquitous
          # base libs (zlib, etc.) that auto-detection would otherwise pick up, so without
          # the switch the build is not actually dependency-free.
          cmake --preset linux-core-dev -DPHOTOEDIT_NO_OPTIONAL_DEPS=ON 2>&1 | tee cfg.log
          # Belt and braces: assert every optional library reported DISABLED, so a future
          # regression in the force-off switch fails here instead of silently linking a dep.
          for lib in "Color mgmt" "PNG I/O" "JPEG I/O" "TIFF I/O" "WebP I/O" "Compression"; do
            grep -q "$lib:.*DISABLED" cfg.log \
              || { echo "::error::optional dependency '$lib' is enabled; this lane must be dependency-free"; exit 1; }
          done
      - name: Build
        run: cmake --build build/linux-core-dev
      - name: Test
        run: ctest --preset linux-core-dev

  # ---------------------------------------------------------------------------
  # clang-tidy (advisory): runs the committed .clang-tidy over the engine core and
  # surfaces findings in the log. Non-blocking by design (continue-on-error) — the
  # config carries no WarningsAsErrors and the codebase has not been triaged to zero
  # findings, so this informs rather than gates. Promote to a gate after triage.
  #
  # Covers src/app as well as src/core. It could not before: the shell was a bare
  # executable with no compile database of its own, and the engine-only preset does not
  # configure Qt. ADR-0008 made it a library, so it can be built and analyzed here.
  # ---------------------------------------------------------------------------
  tidy-linux:
    name: clang-tidy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools + libs (so codec/color/Qt headers resolve)
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy pkg-config liblcms2-dev libpng-dev libturbojpeg0-dev zlib1g-dev libtiff-dev libwebp-dev qt6-base-dev libqt6svg6-dev
      # The app is built here purely so src/app has a compile database. The engine-only
      # preset cannot analyze the shell: without Qt configured, every file in src/app
      # fails at the first include rather than being analyzed.
      - name: Configure with the app on (exports compile_commands.json)
        run: >
          cmake -B build/tidy -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPHOTOEDIT_BUILD_APP=ON
          -DPHOTOEDIT_BUILD_TESTS=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # Generated sources (moc, qrc) must exist before analysis, or every file that
      # includes a moc output is reported as a missing header rather than analyzed.
      - name: Generate Qt sources
        run: cmake --build build/tidy --target pe_app
      - name: Run clang-tidy on the engine core and the shell
        run: clang-tidy -p build/tidy $(git ls-files 'src/core/src/*.cpp' 'src/app/*.cpp')

  # ---------------------------------------------------------------------------
  # Sanitizers over the Qt shell. The ASan/UBSan step in core-linux builds with
  # PHOTOEDIT_BUILD_APP=OFF, so the engine has always been sanitized and src/app
  # never was, despite being the layer with all the Qt ownership and observer
  # lifetime coupling (MainWindow's destructor detaches four observers precisely to
  # avoid a dangling removeObserver, a rule guarded only by a comment until now).
  #
  # This became possible when the shell became a library with its own test binary:
  # pe_app_tests constructs a real MainWindow on the offscreen platform, so there
  # is finally something to run under a sanitizer.
  #
  # detect_leaks is off: Qt is not built with ASan here and allocates one-time
  # internals it never frees, so LeakSanitizer reports it rather than us. The
  # use-after-free and UB checks, which are what this lane is actually for, stay on.
  # ---------------------------------------------------------------------------
  asan-app-linux:
    name: Shell under ASan/UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libqt6svg6-dev
      - name: Configure with sanitizers
        run: >
          cmake -B build/asan-app -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPHOTOEDIT_BUILD_APP=ON
          -DPHOTOEDIT_BUILD_TESTS=ON
          -DPHOTOEDIT_WERROR=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build/asan-app
      - name: Run the shell tests under the sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/asan-app -R pe_app_tests --output-on-failure
